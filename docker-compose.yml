version: "3.8"
services:
  app:
    build: .
    restart: always
    ports:
      - "127.0.0.1:8000:8080"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - model_cache:/tmp/ix_tips_model_cache
      - backups:/code/backups
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  cron:
    build: .
    restart: always
    command: supercronic /code/crontab
    env_file:
      - .env
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - model_cache:/tmp/ix_tips_model_cache
      - backups:/code/backups

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ix_tips
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ix_tips"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  model_cache:
  backups:
